name: Bug Report
description: Report a bug in a @maelstrom-co package
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please fill in as much detail as you can.

  - type: input
    id: package
    attributes:
      label: Package
      description: Which @maelstrom-co package is affected?
      placeholder: "@maelstrom-co/client, @maelstrom-co/react, etc."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package Version
      placeholder: "0.1.0-alpha.3"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Runtime, OS, browser (if applicable)"
      placeholder: "Node 22.4 / Bun 1.2 / macOS 15 / Chrome 130"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Logs, screenshots, repo links, anything else relevant.
    validations:
      required: false

  - type: textarea
    id: devtools
    attributes:
      label: DevTools Evidence (Optional)
      description: |
        If DevTools is available, include the request ID, observed stages, or a recording from the reproduction.
        Follow the [DevTools guide](https://docs.maelstrom-ai.co/guides/devtools/#record-and-reopen-a-problem).
        Inspect and redact any recording before sharing it. Built-in redaction does not cover all application data.
        A recording is optional; you can report a bug without installing DevTools or recording content.
    validations:
      required: false
