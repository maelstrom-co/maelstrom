name: Feedback and feature request
description: Share feedback or request a capability
labels: ["preview-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the workflow you want to support and what would improve it.
        Remove credentials, customer data, and private logs before posting.
        Report vulnerabilities privately using [the security policy](https://github.com/maelstrom-co/maelstrom/security/policy).

  - type: input
    id: package
    attributes:
      label: Package / Area
      description: Which package or area does this relate to?
      placeholder: "@maelstrom-co/client, voice, docs, DX, etc."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0-alpha.3"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feedback Category
      options:
        - API ergonomics
        - Missing capability
        - Documentation gap
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: What's your experience? What would make it better?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you building? How are you using Maelstrom?
    validations:
      required: false
