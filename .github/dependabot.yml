version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Alchemy, Effect, and the Cloudflare toolchain form one compatibility
      # unit; updating them separately breaks deployment pinning assumptions.
      cloudflare-runtime-unit:
        patterns:
          - alchemy
          - effect
          - '@effect/*'
          - wrangler
          - '@cloudflare/*'
