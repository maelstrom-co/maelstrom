name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

env:
  NX_NO_CLOUD: ${{ github.repository != 'maelstrom-co/maelstrom' || github.event.pull_request.head.repo.fork == true || vars.NX_NO_CLOUD == 'true' }}

jobs:
  main:
    runs-on: ${{ github.repository == 'maelstrom-co/maelstrom' && github.event.pull_request.head.repo.fork != true && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Read from .bun-version so every workflow, and every contributor,
          # runs one version. This job used to take `latest`, which made
          # flag-level differences invisible until CI: `bun test --isolate`
          # does not exist in 1.3.7, and Bun accepts unknown flags silently
          # rather than rejecting them, so a suite that genuinely needs
          # isolation ran unisolated locally and passed, then leaked across
          # files here.
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

      - name: Audit dependency advisories
        run: bun audit

      - name: Validate canonical prompt sources and versions
        if: github.event_name == 'pull_request'
        env:
          PROMPT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROMPT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cd apps/docs && bun run prompts:check -- "$PROMPT_BASE_SHA" "$PROMPT_HEAD_SHA"

      # Vale scans the complete authored corpus. Reviewdog must not hide errors
      # outside the pull request diff when a rule or configuration changes.
      - name: Select authored documentation
        id: vale-files
        run: bun scripts/vale-files.ts --github-output >> "$GITHUB_OUTPUT"

      - name: Lint documentation prose
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          fail_on_error: true
          files: ${{ steps.vale-files.outputs.files }}
          filter_mode: nofilter
          min_alert_level: error
          reporter: github-pr-annotations
          vale_flags: --no-global
          version: 3.18.0

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # Browsers install per machine, not per project, so this one step covers
      # both the docs and www e2e suites.
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: apps/docs

      # `check` and not `format`: the format target writes. Running it here
      # reformatted the checkout and then reported success, so formatting drift
      # could never fail CI — it was silently fixed and thrown away. `check`
      # is read-only and supersets lint, adding the formatter and import-order
      # assists, and the biome plugin passes --error-on-warnings so a warning
      # fails the build rather than scrolling past.
      - name: Run check, test, build, typecheck, e2e
        run: bunx nx run-many -t check test build typecheck e2e
      # Reads apps/docs/dist, so it has to follow the build rather than join the
      # nx run above. The e2e suite link-checks a handful of pages it navigates;
      # this covers every page the build emits, including generated reference.
      - name: Assert no dead links in the built docs
        run: bun scripts/assert-docs-links.ts
      # - run: bunx nx fix-ci
      #   if: always()
