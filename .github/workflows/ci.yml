name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

env:
  NX_NO_CLOUD: ${{ github.repository != 'maelstrom-co/maelstrom' || github.event.pull_request.head.repo.fork == true || vars.NX_NO_CLOUD == 'true' }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Reads only bun.lock with Node built-ins, so it needs no install.
  single-copy-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Assert single resolved versions of shared packages
        run: node scripts/assert-single-copy-dependencies.mts

  verify:
    runs-on: ${{ github.repository == 'maelstrom-co/maelstrom' && github.event.pull_request.head.repo.fork != true && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Read from .bun-version so every workflow, and every contributor,
          # runs one version. This job used to take `latest`, which made
          # flag-level differences invisible until CI: `bun test --isolate`
          # does not exist in 1.3.7, and Bun accepts unknown flags silently
          # rather than rejecting them, so a suite that genuinely needs
          # isolation ran unisolated locally and passed, then leaked across
          # files here.
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

      - name: Check formatting
        run: bunx nx format:check --all

      - name: Audit dependency advisories
        run: bun audit

      - name: Validate canonical prompt sources and versions
        if: github.event_name == 'pull_request'
        env:
          PROMPT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROMPT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cd apps/docs && bun run prompts:check -- "$PROMPT_BASE_SHA" "$PROMPT_HEAD_SHA"

      # Vale scans the complete authored corpus. Reviewdog must not hide errors
      # outside the pull request diff when a rule or configuration changes.
      - name: Select authored documentation
        id: vale-files
        run: bun scripts/vale-files.ts --github-output >> "$GITHUB_OUTPUT"

      - name: Lint documentation prose
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          fail_on_error: true
          files: ${{ steps.vale-files.outputs.files }}
          filter_mode: nofilter
          min_alert_level: error
          reporter: github-pr-annotations
          vale_flags: --no-global
          version: 3.18.0

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # Some docs unit tests launch Chromium: the browser grader in
      # apps/docs/prompts/evaluation/graders/browser-case.mjs, exercised by
      # browser-case.test.ts and index.test.ts. Playwright installs only when
      # that project is in scope.
      - name: Select browser need
        id: browser-need
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            browser=$(bunx nx show projects --affected --projects=@maelstrom-co/docs --json | jq 'length > 0')
          else
            browser=true
          fi
          echo "browser=$browser" >> "$GITHUB_OUTPUT"

      - name: Read Playwright version
        id: playwright
        if: steps.browser-need.outputs.browser == 'true'
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.browser-need.outputs.browser == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.browser-need.outputs.browser == 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/docs

      # Pull requests run Nx's task-based affected selection, so each target
      # runs only when its own inputs changed. Pushes to main run everything.
      - name: Run lint, tests, builds, typechecks, and artifact validation
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            bunx nx affected -t lint test build typecheck sdk-validation links-check
          else
            bunx nx run-many -t lint test build typecheck sdk-validation links-check
          fi

      # - run: bunx nx fix-ci
      #   if: always()

  # The only job that needs a browser, so Playwright installs here and only
  # when an e2e suite or the docs starter is in scope.
  e2e:
    runs-on: ${{ github.repository == 'maelstrom-co/maelstrom' && github.event.pull_request.head.repo.fork != true && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # The exported starter is built from apps/docs/starters, so a docs change
      # is what puts its consumer check in scope.
      - name: Select projects
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            affected=$(bunx nx show projects --affected --withTarget=e2e --json)
            e2e=$(jq 'length > 0' <<< "$affected")
            docs=$(bunx nx show projects --json --affected --projects=@maelstrom-co/docs | jq 'length > 0')
          else
            e2e=true
            docs=true
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          if [ "$e2e" = true ] || [ "$docs" = true ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Playwright version
        id: playwright
        if: steps.scope.outputs.browser == 'true'
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"

      # Caches the browser binaries only. `--with-deps` still installs the
      # system libraries through apt on every run.
      - name: Cache Playwright browsers
        if: steps.scope.outputs.browser == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Browsers install per machine, not per project, so this one step covers
      # the docs, www, and demo e2e suites and the exported starter.
      - name: Install Playwright browser
        if: steps.scope.outputs.browser == 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/docs

      - name: Run e2e
        if: steps.scope.outputs.e2e == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            bunx nx affected -t e2e
          else
            bunx nx run-many -t e2e
          fi

      - name: Verify the exported starter as a standalone consumer
        if: steps.scope.outputs.docs == 'true'
        run: bun apps/docs/tools/skills/verify-starter-consumer.ts "$GITHUB_SHA"

  # Branch protection requires a check named `main`. This job keeps that name
  # stable while the work runs in parallel jobs.
  main:
    if: always()
    needs:
      - single-copy-dependencies
      - verify
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A CI job finished as $result"
              exit 1
            fi
          done
