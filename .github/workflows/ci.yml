name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read
  id-token: write

env:
  NX_NO_CLOUD: ${{ vars.NX_NO_CLOUD }}

jobs:
  main:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: apps/docs

      # `check` and not `format`: the format target writes. Running it here
      # reformatted the checkout and then reported success, so formatting drift
      # could never fail CI — it was silently fixed and thrown away. `check`
      # is read-only and supersets lint, adding the formatter and import-order
      # assists, and the biome plugin passes --error-on-warnings so a warning
      # fails the build rather than scrolling past.
      - name: Run check, test, build, typecheck, e2e
        run: bunx nx run-many -t check test build typecheck e2e
      # - run: bunx nx fix-ci
      #   if: always()
