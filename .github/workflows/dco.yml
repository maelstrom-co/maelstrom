name: DCO

# pull_request_target, not pull_request: fork PRs are the population that most
# needs this check, and posting the verdict needs `pull-requests: write` — a
# token a fork's `pull_request` run never gets. What makes that safe is that
# this workflow never checks out or executes PR-supplied code: the checkout
# below pins `ref:` to the default branch, so `uses: ./.github/actions/dco-check`
# always resolves from trusted sources regardless of what the PR is stacked on;
# the only PR-derived data is commit metadata read over the API. This job must
# never add a `ref:` pointing at `github.event.pull_request.head.*` (`head.sha`
# or `head.ref`), and must never add a step that installs dependencies from or
# executes the checked-out tree.
on:
  pull_request_target:
    # `edited` covers base-branch retargets: those fire this event without
    # changing the head SHA, so the commit range this check should audit
    # shifts while the check-run it's attached to would otherwise still show
    # the previous, now-stale pass. Re-running on every title/body edit too is
    # an acceptable cost — the job is cheap and idempotent.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job id is the status-check name that branch protection pins. Renaming
  # it breaks enforcement silently, so there is deliberately no `name:`
  # override. There is also deliberately no `if:` — a skipped job reports
  # success to branch protection, which would hollow out the check entirely.
  dco:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # The action's pagination loops only exit on a short page or a thrown
    # error; anything that keeps returning full pages would otherwise burn
    # the 6-hour default budget with the required check stuck pending.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          # Path must stay in sync with the `uses:` path below — this is what
          # makes that local action resolvable at all.
          sparse-checkout: .github/actions/dco-check
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Floating, unlike the third-party actions above: this is our own
          # toolchain, not PR- or fork-supplied code, so there's no supply-chain
          # exposure to pin against.
          bun-version: latest
      - uses: ./.github/actions/dco-check
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          # Provenance, not code: the bot-author exemption is honoured only for
          # branches in this repository, which nobody without write access can
          # push to. Read from the event payload rather than the API — it costs
          # no request, and it cannot fail on a gate that must fail closed.
          head-repository: ${{ github.event.pull_request.head.repo.full_name }}
