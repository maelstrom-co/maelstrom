name: Dependency Audit

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit dependency advisories
    if: github.repository == 'maelstrom-co/maelstrom'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

      - name: Audit dependency advisories
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          bun audit 2>&1 | tee audit-report.txt

      # One open issue collects every failing day, so a new advisory is
      # reported once instead of on each pull request.
      - name: Report the failing audit
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Dependency audit is failing on main'
          {
            echo "\`bun audit\` failed on main in [this run]($RUN_URL)."
            echo
            echo '```'
            cat audit-report.txt
            echo '```'
          } > issue-body.md
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue-body.md
          else
            gh issue create --title "$title" --body-file issue-body.md
          fi

      - name: Fail the run
        if: steps.audit.outcome == 'failure'
        run: exit 1
