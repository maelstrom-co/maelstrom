name: Deploy Playground

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned, unlike ci.yml and publish-pr.yml: this job holds a Cloudflare
          # token that can delete Workers, so it does not take whatever toolchain
          # ships that morning. Keep in sync with the root bun.lock.
          bun-version: "1.3.7"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build demo
        # VITE_HOSTED=1 flips every hosted-mode gate in the client bundle
        # (key drawer, playground.hello handshake, same-origin WS URL,
        # browser-direct mint) — without it the deployed SPA is a keyless
        # local-mode build that tries ws://localhost:3001 and never works.
        run: VITE_HOSTED=1 bunx nx build @maelstrom-co/demo

      # ONE-TIME PRECONDITION, for the first deploy after the Durable Objects
      # migration only: the container-era Worker must be deleted first, with
      # `bunx wrangler delete maelstrom-playground`. apps/demo/wrangler.jsonc
      # declares a single `v1` creating SessionDO, which assumes a Worker with
      # no migration history. Run against the old Worker, Cloudflare sees `v1`
      # as already applied, skips it, and the deploy fails with SESSION_DO
      # bound to a class that has no namespace — an error that does not name
      # the actual cause, hence this note. Every deploy after the first is
      # ordinary and needs nothing special.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/demo
          # apps/demo has no lockfile, so the action would otherwise npm-install
          # the latest wrangler 4.x — keep this in sync with the root bun.lock.
          wranglerVersion: "4.114.0"
          command: deploy
