name: Deploy Playground

on:
  workflow_dispatch: {}

concurrency:
  group: production-demo
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  NX_NO_CLOUD: 'true'

jobs:
  deploy:
    if: github.repository == 'maelstrom-co/maelstrom'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: production
      url: https://demo.maelstrom-ai.co
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      # Equal variables would let one swapped secret pass both account guards.
      - name: Assert distinct account variables
        env:
          PRODUCTION_ACCOUNT_ID: ${{ vars.PRODUCTION_ACCOUNT_ID }}
          PREVIEW_ACCOUNT_ID: ${{ vars.PREVIEW_ACCOUNT_ID }}
        run: |
          test -n "$PRODUCTION_ACCOUNT_ID"
          test -n "$PREVIEW_ACCOUNT_ID"
          test "$PRODUCTION_ACCOUNT_ID" != "$PREVIEW_ACCOUNT_ID"

      - name: Setup Node
        # Wrangler 4 needs Node >=22. Match the workspace engine so the manual
        # fallback uses the same runtime as continuous deployment.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # This job holds a Cloudflare token that can delete Workers, so it
          # must not take whatever toolchain ships that morning. Every workflow
          # now reads the same pin from .bun-version.
          bun-version-file: .bun-version

      - name: Resolve latest green revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$(bun scripts/latest-green-ci.ts)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.revision.outputs.sha }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production artifact
        run: bunx nx run @maelstrom-co/demo:build-hosted --skip-nx-cache

      - name: Recheck deployment revision
        id: deploy-revision
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_green_sha="$(bun scripts/latest-green-ci.ts)"
          if [ "$latest_green_sha" = "$DEPLOY_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale artifact $DEPLOY_SHA; latest green revision is $latest_green_sha"
          fi

      - name: Deploy to Cloudflare with Alchemy
        if: steps.deploy-revision.outputs.current == 'true'
        working-directory: apps/demo
        run: bun alchemy deploy --stage prod --profile production-ci --yes
        env:
          ALCHEMY_PROFILE: production-ci
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          EXPECTED_CLOUDFLARE_ACCOUNT_ID: ${{ vars.PRODUCTION_ACCOUNT_ID }}

      - name: Smoke test production domain
        if: steps.deploy-revision.outputs.current == 'true'
        run: curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 20 https://demo.maelstrom-ai.co > /dev/null
