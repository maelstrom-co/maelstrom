name: Deploy Playground

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build demo
        # VITE_HOSTED=1 flips every hosted-mode gate in the client bundle
        # (key drawer, playground.hello handshake, same-origin WS URL,
        # browser-direct mint) — without it the deployed SPA is a keyless
        # local-mode build that tries ws://localhost:3001 and never works.
        run: VITE_HOSTED=1 bunx nx build @maelstrom-co/demo

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/demo
          # apps/demo has no lockfile, so the action would otherwise npm-install
          # the latest wrangler 4.x — keep this in sync with the root bun.lock.
          wranglerVersion: "4.80.0"
          command: deploy
