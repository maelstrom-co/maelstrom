name: Deploy Playground

on:
  workflow_dispatch: {}

concurrency:
  group: production-demo
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  NX_NO_CLOUD: 'true'

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: production
      url: https://demo.maelstrom-ai.co
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Setup Node
        # Wrangler 4 needs Node >=22. Match the workspace engine so the manual
        # fallback uses the same runtime as continuous deployment.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # This job holds a Cloudflare token that can delete Workers, so it
          # must not take whatever toolchain ships that morning. Every workflow
          # now reads the same pin from .bun-version.
          bun-version-file: .bun-version

      - name: Resolve latest green revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$(bun scripts/latest-green-ci.ts)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.revision.outputs.sha }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production artifact
        run: bunx nx run @maelstrom-co/demo:build-hosted --skip-nx-cache

      - name: Deploy to Cloudflare
        working-directory: apps/demo
        run: bunx wrangler deploy --env=""
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}

      - name: Smoke test production domain
        run: curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 20 https://demo.maelstrom-ai.co > /dev/null
