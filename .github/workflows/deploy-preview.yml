name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: write

env:
  NX_NO_CLOUD: 'true'

jobs:
  deploy:
    name: Deploy Preview
    # Forks cannot read repository secrets, so a fork PR gets no preview. The
    # alternative, `pull_request_target`, would run untrusted code holding the
    # Cloudflare token — not a trade we make.
    #
    # A closed PR can still receive a `labeled` event, and no `closed` event
    # will ever fire for it again — the state check below is what stops
    # re-labelling a closed PR from deploying a preview nothing can tear down.
    #
    # `labeled` fires for any label, not just `deploy-preview` — without the
    # action/label check below, adding an unrelated label to a PR that already
    # carries `deploy-preview` would redeploy an already-live, unchanged commit.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.action != 'closed'
      && github.event.action != 'unlabeled'
      && github.event.pull_request.state == 'open'
      && (github.event.action != 'labeled'
        || github.event.label.name == 'deploy-preview')
      && contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: preview
    # Deploy and teardown deliberately share one group so teardown can cancel an
    # in-flight deploy for the same PR. Declared per-job, not at workflow level:
    # a run whose jobs are all skipped would otherwise cancel an in-flight
    # teardown it has nothing to do with.
    concurrency:
      group: deploy-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        # wrangler-action probes the toolchain with `npx wrangler --version` and
        # silently falls back to `npm i wrangler` when that fails. The runner
        # defaults to Node 20, wrangler 4 needs >= 22, so without this the probe
        # fails and the npm fallback then dies on bun's `workspace:*` protocol —
        # surfacing as an npm EUNSUPPORTEDPROTOCOL error that names neither Node
        # nor the real cause.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # This job holds a Cloudflare token that can delete Workers, so it
          # must not take whatever toolchain ships that morning. Every workflow
          # now reads the same pin from .bun-version.
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve the installed wrangler version
        id: wrangler
        # Read it from the workspace rather than hardcoding. wrangler-action
        # probes `npx --no-install wrangler --version` and treats *any*
        # mismatch against the version it was given as "incompatible", then
        # falls back to `npm i wrangler@<pinned>` — which dies on bun's
        # `workspace:*` protocol. So a stale pin here does not degrade to an
        # older wrangler, it fails the deploy outright. A hardcoded value went
        # stale within a day of landing; deriving it cannot.
        run: echo "version=$(node -p "require('wrangler/package.json').version")" >> "$GITHUB_OUTPUT"

      # Build every independent artifact before the first deployment. The
      # website remains dependent on the deployed Playground URL.
      - name: Build independent preview artifacts
        run: |
          bunx nx run @maelstrom-co/demo:build-hosted --skip-nx-cache
          bunx nx run @maelstrom-co/docs:build --skip-nx-cache

      - name: Validate independent route-free preview configurations
        run: >-
          bun -e "import { unstable_readConfig } from 'wrangler';
          for (const config of ['apps/demo/wrangler.jsonc',
          'apps/docs/wrangler.json']) {
            const resolved = unstable_readConfig({ config, env: 'preview' },
            { hideWarnings: true });
            if (resolved.workers_dev !== true || resolved.routes?.length) {
              throw new Error(config + ' must enable workers.dev and define no preview routes');
            }
            if (resolved.kv_namespaces?.some((namespace) => !namespace.id)) {
              throw new Error(config + ' must not auto-provision preview KV namespaces');
            }
          }"

      # Each PR gets an isolated Worker and SessionDO namespace.
      - name: Deploy demo to Cloudflare
        id: deploy-demo
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          workingDirectory: apps/demo
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          command: deploy --env preview --name maelstrom-playground-pr-${{ github.event.pull_request.number }}

      - name: Validate Playground preview URL
        id: playground-url
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-demo.outputs.deployment-url }}
        run: |
          set -euo pipefail
          bun -e "const value = process.env.DEPLOYMENT_URL; if (!value || !value.toLowerCase().startsWith('https://') || /\s/u.test(value)) throw new Error('Playground deploy must report one non-empty absolute HTTPS URL'); const parsed = new URL(value); if (parsed.username || parsed.password) throw new Error('Playground deploy must report an absolute HTTPS URL without credentials');"
          printf 'url=%s\n' "$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Build website preview
        env:
          CLOUDFLARE_ENV: preview
          PUBLIC_PLAYGROUND_URL: ${{ steps.playground-url.outputs.url }}
        run: bunx nx run @maelstrom-co/www:build --skip-nx-cache

      - name: Deploy www to Cloudflare with Alchemy
        id: deploy-www
        working-directory: apps/www
        env:
          ALCHEMY_PROFILE: preview-ci
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          PREVIEW_STAGE: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          bun alchemy deploy alchemy.preview.run.ts --stage "$PREVIEW_STAGE" --profile preview-ci --yes
          state="$(bun alchemy state get ../../infra/platform/state.run.ts --stack MaelstromWwwPreview --stage "$PREVIEW_STAGE" --fqn Website --profile preview-ci)"
          url="$(printf '%s' "$state" | bun -e "const state = JSON.parse(await Bun.stdin.text()); const url = state?.attr?.url; if (typeof url !== 'string' || !url.startsWith('https://')) throw new Error('Website preview state must contain an HTTPS Worker URL'); process.stdout.write(url);")"
          printf 'deployment-url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Deploy docs to Cloudflare with Alchemy
        id: deploy-docs
        working-directory: apps/docs
        env:
          ALCHEMY_PROFILE: preview-ci
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          PREVIEW_STAGE: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          bun alchemy deploy alchemy.preview.run.ts --stage "$PREVIEW_STAGE" --profile preview-ci --yes
          state="$(bun alchemy state get ../../infra/platform/state.run.ts --stack MaelstromDocsPreview --stage "$PREVIEW_STAGE" --fqn Website --profile preview-ci)"
          url="$(printf '%s' "$state" | bun -e "const state = JSON.parse(await Bun.stdin.text()); const url = state?.attr?.url; if (typeof url !== 'string' || !url.startsWith('https://')) throw new Error('Docs preview state must contain an HTTPS Worker URL'); process.stdout.write(url);")"
          printf 'deployment-url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Require all preview URLs
        env:
          WWW_URL: ${{ steps.deploy-www.outputs.deployment-url }}
          DOCS_URL: ${{ steps.deploy-docs.outputs.deployment-url }}
          DEMO_URL: ${{ steps.playground-url.outputs.url }}
        run: |
          set -euo pipefail
          for app in WWW DOCS DEMO; do
            url_variable="${app}_URL"
            if [ -z "${!url_variable}" ]; then
              echo "::error::$app deploy succeeded but reported no workers.dev URL. Check the preview account's workers.dev subdomain."
              exit 1
            fi
          done

      - name: Find existing preview comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- pr-preview-demo -->'
          direction: last

      - name: Comment the preview URL
        # Edited in place rather than posted fresh per push (which is what
        # publish-pr.yml does): the URL is stable across pushes, so a new comment
        # on every synchronize would be pure noise.
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- pr-preview-demo -->
            **PR previews deployed** for commit ${{ github.event.pull_request.head.sha }}

            | App | Preview |
            | --- | --- |
            | Website | ${{ steps.deploy-www.outputs.deployment-url }} |
            | Documentation | ${{ steps.deploy-docs.outputs.deployment-url }} |
            | Demo | ${{ steps.playground-url.outputs.url }} |

            The demo is bring-your-own-key. This preview runs the PR branch's own code, so use a throwaway key or only open previews for branches you trust.

            Remove the `deploy-preview` label or close this PR to tear the preview down.

  teardown:
    name: Tear Down Preview
    # Gated on the label having been present, not merely on the PR closing —
    # otherwise every close in the repo would ask Cloudflare to delete a Worker
    # that was never created. On `closed` the labels are still attached; on
    # `unlabeled` the removed label arrives as github.event.label.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && (
        (github.event.action == 'closed'
          && contains(github.event.pull_request.labels.*.name, 'deploy-preview'))
        || (github.event.action == 'unlabeled'
          && github.event.label.name == 'deploy-preview')
      )
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: preview
    # Same group as the deploy job — see the comment there.
    concurrency:
      group: deploy-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout trusted teardown code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Destroy docs preview with Alchemy
        id: destroy-docs
        working-directory: apps/docs
        env:
          ALCHEMY_PROFILE: preview-ci
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          PREVIEW_STAGE: pr-${{ github.event.pull_request.number }}
        run: bun alchemy destroy alchemy.preview.run.ts --stage "$PREVIEW_STAGE" --profile preview-ci --yes

      - name: Destroy www preview with Alchemy
        id: destroy-www
        if: always()
        working-directory: apps/www
        env:
          ALCHEMY_PROFILE: preview-ci
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          PREVIEW_STAGE: pr-${{ github.event.pull_request.number }}
        run: bun alchemy destroy alchemy.preview.run.ts --stage "$PREVIEW_STAGE" --profile preview-ci --yes

      - name: Delete preview Workers
        id: delete-workers
        if: always()
        # Cancellation cannot recall an upload already accepted by Cloudflare.
        # Repeat every deletion while canceled uploads settle, and report only
        # errors from the final pass so transient failures can recover.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          workers=(
            "maelstrom-www-pr-$PR_NUMBER"
            "maelstrom-www-alchemy-pr-$PR_NUMBER"
            "maelstrom-docs-pr-$PR_NUMBER"
            "maelstrom-docs-alchemy-pr-$PR_NUMBER"
            "maelstrom-playground-pr-$PR_NUMBER"
          )
          delete_workers() {
            local failed=0
            for worker_name in "${workers[@]}"; do
              if output=$(npx --yes wrangler@4.115.0 delete --name "$worker_name" --force 2>&1); then
                status=0
              else
                status=$?
              fi
              printf '%s\n' "$output"
              if [ "$status" -eq 0 ]; then
                continue
              fi
              if grep -qiE 'script_not_found|\[code: ?10007\]|\[code: ?10090\]' <<<"$output"; then
                echo "No preview Worker named $worker_name; nothing to tear down."
                continue
              fi
              echo "Failed to delete preview Worker $worker_name."
              failed=1
            done
            return "$failed"
          }

          failed=0
          for attempt in 1 2 3; do
            echo "Preview deletion pass $attempt of 3"
            if delete_workers; then
              failed=0
            else
              failed=1
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Preview Worker deletion still failed after three attempts."
          fi
          exit "$failed"

      - name: Find existing preview comment
        if: always()
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- pr-preview-demo -->'
          direction: last

      - name: Mark the preview comment torn down
        # Only ever rewrites an existing comment. A PR whose deploy never
        # succeeded has no comment, and a "torn down" notice there would be
        # noise about something that never existed.
        if: >-
          always()
          && steps.find-comment.outputs.comment-id != ''
          && steps.destroy-docs.outcome == 'success'
          && steps.destroy-www.outcome == 'success'
          && steps.delete-workers.outcome == 'success'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- pr-preview-demo -->
            **PR previews torn down.** The website, documentation, and demo preview Workers for this PR have been deleted.

            Re-add the `deploy-preview` label while the PR is open to bring it back.

      - name: Mark incomplete preview teardown
        if: >-
          always()
          && steps.find-comment.outputs.comment-id != ''
          && (steps.destroy-docs.outcome != 'success'
            || steps.destroy-www.outcome != 'success'
            || steps.delete-workers.outcome != 'success')
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- pr-preview-demo -->
            **PR preview teardown incomplete.** At least one Cloudflare cleanup step failed. Retry this workflow before assuming every preview resource is gone.
