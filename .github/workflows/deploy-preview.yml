name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: write

env:
  NX_NO_CLOUD: ${{ vars.NX_NO_CLOUD }}

concurrency:
  # deploy and teardown deliberately share one group: a teardown must be able
  # to cancel an in-flight deploy for the same PR, so a deploy can never land
  # after the teardown that was meant to remove it.
  group: deploy-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Preview
    # Forks cannot read repository secrets, so a fork PR gets no preview. The
    # alternative, `pull_request_target`, would run untrusted code holding the
    # Cloudflare token — not a trade we make.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.action != 'closed'
      && github.event.action != 'unlabeled'
      && contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build demo
        # VITE_HOSTED=1 flips every hosted-mode gate in the client bundle (key
        # drawer, playground.hello handshake, same-origin WS URL, browser-direct
        # mint) — without it the deployed SPA is a keyless local-mode build that
        # tries ws://localhost:3001 and never works.
        run: VITE_HOSTED=1 bunx nx build @maelstrom-co/demo

      - name: Deploy to Cloudflare
        id: deploy
        # A separately-named Worker per PR, not `wrangler versions upload`:
        # Cloudflare does not generate preview URLs for Workers that implement a
        # Durable Object, and this one exports SessionDO. A brand-new Worker per
        # PR also satisfies the no-migration-history precondition that the single
        # `v1` migration in apps/demo/wrangler.jsonc assumes.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/demo
          # apps/demo has no lockfile, so the action would otherwise npm-install
          # the latest wrangler 4.x — keep this in sync with the root bun.lock.
          wranglerVersion: "4.114.0"
          command: deploy --name maelstrom-playground-pr-${{ github.event.pull_request.number }}

      - name: Require a preview URL
        # apps/demo/wrangler.jsonc sets no `workers_dev` key, so a deploy can
        # succeed while returning no URL if the account's workers.dev subdomain
        # is off. Fail here rather than post a comment with a blank link.
        if: steps.deploy.outputs.deployment-url == ''
        run: |
          echo "::error::Deploy succeeded but reported no preview URL. Check that the workers.dev subdomain is enabled for this account, or add \"workers_dev\": true to apps/demo/wrangler.jsonc."
          exit 1

      - name: Find existing preview comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- pr-preview-demo -->'
          direction: last

      - name: Comment the preview URL
        # Edited in place rather than posted fresh per push (which is what
        # publish-pr.yml does): the URL is stable across pushes, so a new comment
        # on every synchronize would be pure noise.
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- pr-preview-demo -->
            **Playground preview deployed** for commit ${{ github.event.pull_request.head.sha }}

            ${{ steps.deploy.outputs.deployment-url }}

            The playground is bring-your-own-key — it will ask for your own API key on load, and nothing is stored server-side.

            Remove the `deploy-preview` label or close this PR to tear the preview down.
