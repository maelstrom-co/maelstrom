name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: write

env:
  NX_NO_CLOUD: ${{ vars.NX_NO_CLOUD }}

jobs:
  deploy:
    name: Deploy Preview
    # Forks cannot read repository secrets, so a fork PR gets no preview. The
    # alternative, `pull_request_target`, would run untrusted code holding the
    # Cloudflare token — not a trade we make.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.action != 'closed'
      && github.event.action != 'unlabeled'
      && contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # deploy and teardown deliberately share one group: a teardown must be able
    # to cancel an in-flight deploy for the same PR, so a deploy can never land
    # after the teardown that was meant to remove it. Declared per-job, not at
    # workflow level: a run whose jobs are all skipped still joins a
    # workflow-level group and would cancel an in-flight teardown it has nothing
    # to do with — after which no further event could retry it.
    concurrency:
      group: deploy-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned, unlike ci.yml and publish-pr.yml: this job holds a Cloudflare
          # token that can delete Workers, so it does not take whatever toolchain
          # ships that morning. Keep in sync with the root bun.lock.
          bun-version: "1.3.7"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build demo
        # VITE_HOSTED=1 flips every hosted-mode gate in the client bundle (key
        # drawer, playground.hello handshake, same-origin WS URL, browser-direct
        # mint) — without it the deployed SPA is a keyless local-mode build that
        # tries ws://localhost:3001 and never works.
        run: VITE_HOSTED=1 bunx nx build @maelstrom-co/demo

      - name: Deploy to Cloudflare
        id: deploy
        # A separately-named Worker per PR, not `wrangler versions upload`:
        # Cloudflare does not generate preview URLs for Workers that implement a
        # Durable Object, and this one exports SessionDO. A brand-new Worker per
        # PR also satisfies the no-migration-history precondition that the single
        # `v1` migration in apps/demo/wrangler.jsonc assumes.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/demo
          # apps/demo has no lockfile, so the action would otherwise npm-install
          # the latest wrangler 4.x — keep this in sync with the root bun.lock.
          wranglerVersion: "4.114.0"
          command: deploy --name maelstrom-playground-pr-${{ github.event.pull_request.number }}

      - name: Require a preview URL
        # apps/demo/wrangler.jsonc sets no `workers_dev` key, so a deploy can
        # succeed while returning no URL if the account's workers.dev subdomain
        # is off. Fail here rather than post a comment with a blank link.
        if: steps.deploy.outputs.deployment-url == ''
        run: |
          echo "::error::Deploy succeeded but reported no preview URL. Check that the workers.dev subdomain is enabled for this account, or add \"workers_dev\": true to apps/demo/wrangler.jsonc."
          exit 1

      - name: Find existing preview comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- pr-preview-demo -->'
          direction: last

      - name: Comment the preview URL
        # Edited in place rather than posted fresh per push (which is what
        # publish-pr.yml does): the URL is stable across pushes, so a new comment
        # on every synchronize would be pure noise.
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- pr-preview-demo -->
            **Playground preview deployed** for commit ${{ github.event.pull_request.head.sha }}

            ${{ steps.deploy.outputs.deployment-url }}

            The playground is bring-your-own-key — it will ask for your own API key on load, and nothing is stored server-side.

            Remove the `deploy-preview` label or close this PR to tear the preview down.

  teardown:
    name: Tear Down Preview
    # Gated on the label having been present, not merely on the PR closing —
    # otherwise every close in the repo would ask Cloudflare to delete a Worker
    # that was never created. On `closed` the labels are still attached; on
    # `unlabeled` the removed label arrives as github.event.label.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && (
        (github.event.action == 'closed'
          && contains(github.event.pull_request.labels.*.name, 'deploy-preview'))
        || (github.event.action == 'unlabeled'
          && github.event.label.name == 'deploy-preview')
      )
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Same group as the deploy job — see the comment there.
    concurrency:
      group: deploy-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned, unlike ci.yml and publish-pr.yml: this job holds a Cloudflare
          # token that can delete Workers, so it does not take whatever toolchain
          # ships that morning. Keep in sync with the root bun.lock.
          bun-version: "1.3.7"

      - name: Delete preview Worker
        # Run through a shell step rather than wrangler-action so a Worker that
        # is already gone can be told apart from a real failure. `wrangler delete`
        # exits non-zero either way, and a blanket continue-on-error would hide
        # auth failures and API outages just as well as it hides a stale name.
        # --force skips wrangler's interactive confirmation, which has no answer
        # in CI. Pinned to the same version as the deploy job.
        # If this step fails for a real reason (auth blip, Cloudflare outage), the
        # Worker and its Durable Object storage are orphaned with no automatic
        # retry — recover manually by re-adding then re-removing the
        # `deploy-preview` label, or by running
        # `bunx wrangler delete --name maelstrom-playground-pr-<N> --force` locally.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: maelstrom-playground-pr-${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # GitHub runs this under `bash -e`, and `set -uo pipefail` does not clear
          # it — a bare `output=$(cmd)` would abort the step at the assignment, so
          # neither the diagnostics below nor the not-found branch would ever run.
          if output=$(bunx wrangler@4.114.0 delete --name "$WORKER_NAME" --force 2>&1); then
            status=0
          else
            status=$?
          fi
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$output" | grep -qiE 'script_not_found|\[code: ?10007\]'; then
            echo "No preview Worker named $WORKER_NAME — nothing to tear down."
            exit 0
          fi
          echo "::error::Failed to delete preview Worker $WORKER_NAME."
          exit "$status"

      - name: Find existing preview comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- pr-preview-demo -->'
          direction: last

      - name: Mark the preview comment torn down
        # Only ever rewrites an existing comment. A PR whose deploy never
        # succeeded has no comment, and a "torn down" notice there would be
        # noise about something that never existed.
        if: steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- pr-preview-demo -->
            **Playground preview torn down.** The preview Worker for this PR has been deleted.

            Re-add the `deploy-preview` label to bring it back.
