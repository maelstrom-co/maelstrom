name: Deploy PR Preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR number with an approved deployment
        required: true
        type: string
      new_benchmark_request:
        description: Allow a fresh paid benchmark on this dispatch and each rerun
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  NX_NO_CLOUD: 'true'

jobs:
  approve:
    name: Record Preview Approval
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.sender.type == 'User'
        && github.event.action == 'labeled'
        && github.event.label.name == 'deploy-preview'
        && github.event.pull_request.state == 'open'
        && github.event.pull_request.head.repo.full_name == github.repository
        && contains(github.event.pull_request.labels.*.name, 'deploy-preview'))
      || (github.event_name == 'workflow_run'
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 3
    outputs:
      pr-number: ${{ steps.manual.outputs.pr-number || steps.automatic.outputs.pr-number }}
      head-sha: ${{ steps.manual.outputs.head-sha || steps.automatic.outputs.head-sha }}
    steps:
      - name: Checkout trusted lifecycle code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Capture approval Bun executable
        id: approval-bun
        run: |
          bun_executable="$(command -v bun)"
          case "$bun_executable" in /*) ;; *) exit 1 ;; esac
          case "$bun_executable" in *[[:space:][:cntrl:]]*) exit 1 ;; esac
          test -x "$bun_executable"
          bun_hash="$(/usr/bin/sha256sum "$bun_executable")"
          printf 'path=%s\n' "$bun_executable" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "${bun_hash%% *}" >> "$GITHUB_OUTPUT"

      - name: Record exact approved revision
        id: manual
        if: github.event_name == 'pull_request_target'
        env:
          BUN_EXECUTABLE: ${{ steps.approval-bun.outputs.path }}
          BUN_OPTIONS: ''
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: ''
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUSTED_BUN_SHA256: ${{ steps.approval-bun.outputs.sha256 }}
        run: |
          bun_hash="$(/usr/bin/sha256sum "$BUN_EXECUTABLE")"
          test "${bun_hash%% *}" = "$TRUSTED_BUN_SHA256"
          "$BUN_EXECUTABLE" --config=scripts/preview-lifecycle.bunfig.toml --no-env-file --no-install scripts/preview-lifecycle.ts approve

      - name: Approve current maintainer revision after successful CI
        id: automatic
        if: github.event_name == 'workflow_run'
        env:
          BUN_EXECUTABLE: ${{ steps.approval-bun.outputs.path }}
          BUN_OPTIONS: ''
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: ''
          TRUSTED_BUN_SHA256: ${{ steps.approval-bun.outputs.sha256 }}
        run: |
          bun_hash="$(/usr/bin/sha256sum "$BUN_EXECUTABLE")"
          test "${bun_hash%% *}" = "$TRUSTED_BUN_SHA256"
          "$BUN_EXECUTABLE" --config=scripts/preview-lifecycle.bunfig.toml --no-env-file --no-install scripts/preview-lifecycle.ts approve-ci

      # A push after the label leaves this run approving a superseded head. The
      # synchronize cancellation only sees runs already waiting, so a stale run
      # stops here before its deploy job can enter the approval wait.
      - name: Confirm the approved revision is still the pull request head
        if: github.event_name == 'pull_request_target' && steps.manual.outputs.pr-number != ''
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.manual.outputs.head-sha }}
          PR_NUMBER: ${{ steps.manual.outputs.pr-number }}
        run: |
          set -euo pipefail
          live_head="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha)"
          if [ "$live_head" != "$HEAD_SHA" ]; then
            printf '::error::Pull request head moved from %s to %s; label the new head to request approval.\n' "$HEAD_SHA" "$live_head"
            exit 1
          fi

      # Label-triggered runs wait for a `preview` environment reviewer, and
      # GitHub surfaces that only on the run page. One sticky comment points
      # reviewers at the run until no job in it is waiting.
      - name: Link pending approval on the pull request
        if: github.event_name == 'pull_request_target' && steps.manual.outputs.pr-number != ''
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.manual.outputs.head-sha }}
          PR_NUMBER: ${{ steps.manual.outputs.pr-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- preview-approval-request -->'
          body="$(printf '%s\nA `preview` environment approval is pending for commit %s: [review the run](%s).\n\nThe run asks once to deploy the preview and, when a voice benchmark is requested, again before benchmarking. This notice is removed when the run no longer waits.' "$marker" "$HEAD_SHA" "$RUN_URL")"
          comment_id="$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi

  deploy:
    name: Deploy Preview
    needs: approve
    if: needs.approve.result == 'success' && needs.approve.outputs.pr-number != ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: ${{ github.event_name == 'workflow_run' && 'preview-auto' || 'preview' }}
    timeout-minutes: 45
    concurrency:
      group: deploy-preview-pr-${{ needs.approve.outputs.pr-number }}
      cancel-in-progress: false
      # actionlint 1.7.12 predates GitHub's concurrency queue support.
      queue: max
    steps:
      - name: Checkout trusted lifecycle code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Checkout approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.approve.outputs.head-sha }}
          path: source

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Capture trusted Bun executable
        id: trusted-bun
        run: |
          bun_executable="$(command -v bun)"
          case "$bun_executable" in /*) ;; *) exit 1 ;; esac
          case "$bun_executable" in *[[:space:][:cntrl:]]*) exit 1 ;; esac
          test -x "$bun_executable"
          bun_hash="$(/usr/bin/sha256sum "$bun_executable")"
          printf 'path=%s\n' "$bun_executable" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "${bun_hash%% *}" >> "$GITHUB_OUTPUT"

      - name: Assert required preview configuration
        env:
          BUN_EXECUTABLE: ${{ steps.trusted-bun.outputs.path }}
          BUN_OPTIONS: ''
          NODE_OPTIONS: ''
          TRUSTED_BUN_SHA256: ${{ steps.trusted-bun.outputs.sha256 }}
          PRODUCTION_ACCOUNT_ID: ${{ vars.PRODUCTION_ACCOUNT_ID }}
          PREVIEW_ACCOUNT_ID: ${{ vars.PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_PREVIEW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_WORKERS_DEV_SUFFIX: ${{ vars.CLOUDFLARE_PREVIEW_WORKERS_DEV_SUFFIX }}
        run: |
          bun_hash="$(/usr/bin/sha256sum "$BUN_EXECUTABLE")"
          test "${bun_hash%% *}" = "$TRUSTED_BUN_SHA256"
          "$BUN_EXECUTABLE" --config=scripts/preview-lifecycle.bunfig.toml --no-env-file --no-install scripts/preview-preflight.ts

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install source dependencies
        working-directory: source
        run: bun install --frozen-lockfile

      - name: Build independent preview artifacts
        working-directory: source
        timeout-minutes: 10
        run: |
          bunx nx run @maelstrom-co/demo:build-hosted --skip-nx-cache
          bunx nx run @maelstrom-co/docs:build --skip-nx-cache

      - name: Deploy demo preview
        id: deploy-demo
        timeout-minutes: 6
        env:
          APPROVED_SHA: ${{ needs.approve.outputs.head-sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          BASH_ENV: /dev/null
          BUN_EXECUTABLE: ${{ steps.trusted-bun.outputs.path }}
          BUN_OPTIONS: ''
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          EXPECTED_CLOUDFLARE_ACCOUNT_ID: ${{ vars.PREVIEW_ACCOUNT_ID }}
          ALCHEMY_REQUIRED_VERSION: ${{ vars.ALCHEMY_REQUIRED_VERSION }}
          ENV: /dev/null
          GH_TOKEN: ${{ github.token }}
          LD_PRELOAD: ''
          NODE_OPTIONS: ''
          PREVIEW_WORKERS_DEV_SUFFIX: ${{ vars.CLOUDFLARE_PREVIEW_WORKERS_DEV_SUFFIX }}
          PR_NUMBER: ${{ needs.approve.outputs.pr-number }}
          SOURCE_ROOT: ${{ github.workspace }}/source
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TRUSTED_BUN_SHA256: ${{ steps.trusted-bun.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git --no-replace-objects rev-parse HEAD)" = "$TRUSTED_WORKFLOW_SHA"
          for runtime_file in scripts/preview-lifecycle.ts scripts/preview-trust.ts scripts/delete-preview-workers.ts scripts/preview-worker-url.ts scripts/preview-lifecycle.bunfig.toml; do
            test "$(/usr/bin/git hash-object "$runtime_file")" = "$(/usr/bin/git --no-replace-objects rev-parse "$TRUSTED_WORKFLOW_SHA:$runtime_file")"
          done
          bun_hash="$(/usr/bin/sha256sum "$BUN_EXECUTABLE")"
          test "${bun_hash%% *}" = "$TRUSTED_BUN_SHA256"
          "$BUN_EXECUTABLE" --config=scripts/preview-lifecycle.bunfig.toml --no-env-file --no-install scripts/preview-lifecycle.ts deploy-app demo

      - name: Build website preview
        working-directory: source
        timeout-minutes: 10
        env:
          CLOUDFLARE_ENV: preview
          PUBLIC_PLAYGROUND_URL: ${{ steps.deploy-demo.outputs.deployment-url }}
          PUBLIC_TURNSTILE_ENVIRONMENT: preview
        run: bunx nx run @maelstrom-co/www:build --skip-nx-cache

      - name: Deploy remaining previews
        timeout-minutes: 15
        env:
          APPROVED_SHA: ${{ needs.approve.outputs.head-sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          BASH_ENV: /dev/null
          BUN_EXECUTABLE: ${{ steps.trusted-bun.outputs.path }}
          BUN_OPTIONS: ''
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          DEMO_URL: ${{ steps.deploy-demo.outputs.deployment-url }}
          ENV: /dev/null
          EXPECTED_CLOUDFLARE_ACCOUNT_ID: ${{ vars.PREVIEW_ACCOUNT_ID }}
          ALCHEMY_REQUIRED_VERSION: ${{ vars.ALCHEMY_REQUIRED_VERSION }}
          GH_TOKEN: ${{ github.token }}
          LD_PRELOAD: ''
          NODE_OPTIONS: ''
          PREVIEW_WORKERS_DEV_SUFFIX: ${{ vars.CLOUDFLARE_PREVIEW_WORKERS_DEV_SUFFIX }}
          PR_NUMBER: ${{ needs.approve.outputs.pr-number }}
          SOURCE_ROOT: ${{ github.workspace }}/source
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TRUSTED_BUN_SHA256: ${{ steps.trusted-bun.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git --no-replace-objects rev-parse HEAD)" = "$TRUSTED_WORKFLOW_SHA"
          for runtime_file in scripts/preview-lifecycle.ts scripts/preview-trust.ts scripts/delete-preview-workers.ts scripts/preview-worker-url.ts scripts/preview-lifecycle.bunfig.toml; do
            test "$(/usr/bin/git hash-object "$runtime_file")" = "$(/usr/bin/git --no-replace-objects rev-parse "$TRUSTED_WORKFLOW_SHA:$runtime_file")"
          done
          bun_hash="$(/usr/bin/sha256sum "$BUN_EXECUTABLE")"
          test "${bun_hash%% *}" = "$TRUSTED_BUN_SHA256"
          "$BUN_EXECUTABLE" --config=scripts/preview-lifecycle.bunfig.toml --no-env-file --no-install scripts/preview-lifecycle.ts finish-deployment

  benchmark-gate:
    name: Check Voice Benchmark Request
    needs: deploy
    # Payload labels are a stale snapshot, so the gate reads live labels. It
    # stays outside the per-PR queue and the `preview` environment so that a
    # run without a live benchmark request never asks for benchmark approval.
    if: >-
      always() && !cancelled()
      && ((github.event_name == 'pull_request_target'
           && github.event.sender.type == 'User'
           && github.event.pull_request.state == 'open'
           && github.event.pull_request.head.repo.full_name == github.repository
           && (needs.deploy.result == 'success'
               || ((github.event.action == 'labeled' || github.event.action == 'unlabeled')
                   && (github.event.label.name == 'bench-voice'
                       || github.event.label.name == 'deploy-preview'))))
          || (github.event_name == 'workflow_dispatch'
              && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
              && inputs.pr_number != ''))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      requested: ${{ steps.labels.outputs.requested }}
    steps:
      - name: Read live benchmark labels
        id: labels
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          labels="$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/labels" --jq '.[].name')"
          requested=false
          if grep -Fxq deploy-preview <<< "$labels" && grep -Fxq bench-voice <<< "$labels"; then
            requested=true
          fi
          printf 'requested=%s\n' "$requested" >> "$GITHUB_OUTPUT"

  voice-benchmark:
    name: Voice Benchmark
    needs: [deploy, benchmark-gate]
    environment: preview
    # A label added during deployment is absent from the original event payload.
    # Approval is requested only when the gate saw both labels live. A label
    # removal needs no run because the active benchmark revokes itself.
    # Both labels and the approved/deployed SHA are checked live under the lock.
    if: >-
      always() && !cancelled()
      && ((github.event_name == 'pull_request_target'
           && github.event.sender.type == 'User'
           && github.event.pull_request.state == 'open'
           && github.event.pull_request.head.repo.full_name == github.repository
           && (needs.deploy.result == 'success'
               || ((github.event.action == 'labeled' || github.event.action == 'unlabeled')
                   && (github.event.label.name == 'bench-voice'
                       || github.event.label.name == 'deploy-preview'))))
          || (github.event_name == 'workflow_dispatch'
              && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
              && inputs.pr_number != ''))
      && needs.benchmark-gate.outputs.requested == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      pull-requests: write
    concurrency:
      group: deploy-preview-pr-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
      # actionlint 1.7.12 predates GitHub's concurrency queue support.
      queue: max
    env:
      MAELSTROM_VOICE_CI_RUN_ID: pr-${{ github.event.pull_request.number || inputs.pr_number }}-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout trusted benchmark code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Check Docker daemon
        run: |
          if ! server_version="$(docker info --format '{{.ServerVersion}}' 2>/dev/null)"; then
            echo '::error::Docker daemon unavailable; docker info failed.'
            exit 1
          fi
          if [[ ! "$server_version" =~ ^[0-9]+(\.[0-9]+){1,2}([+-][[:alnum:]._-]+)?$ ]]; then
            echo '::error::docker info returned an unexpected server version.'
            exit 1
          fi
          printf 'Docker daemon is available (server version %s).\n' "$server_version"

      - name: Authenticate voice tool image pull
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin > /dev/null

      - name: Run approved preview benchmarks and update p95 comment
        env:
          BASH_ENV: /dev/null
          BUN_OPTIONS: ''
          NODE_OPTIONS: ''
          GH_TOKEN: ${{ github.token }}
          VOICE_BENCHMARK_NEW_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.new_benchmark_request && 'true' || 'false' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PREVIEW_WORKERS_DEV_SUFFIX: ${{ vars.CLOUDFLARE_PREVIEW_WORKERS_DEV_SUFFIX }}
          MAELSTROM_E2E_OPENAI_API_KEY: ${{ secrets.MAELSTROM_E2E_OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: bun --config=scripts/preview-lifecycle.bunfig.toml --no-env-file --no-install scripts/voice-benchmark-ci.ts

      - name: Remove owned voice containers
        if: always()
        run: bun --config=scripts/preview-lifecycle.bunfig.toml --no-env-file --no-install scripts/voice-benchmark-ci.ts cleanup

  # Runs after the last job that can wait for approval, so the notice stays up
  # while a benchmark approval is pending and clears as soon as the run ends.
  clear-approval-notice:
    name: Clear Approval Notice
    needs: [approve, deploy, benchmark-gate, voice-benchmark]
    if: always() && github.event_name == 'pull_request_target' && needs.approve.outputs.pr-number != ''
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 3
    permissions:
      pull-requests: write
    steps:
      - name: Remove this run's pending approval notice
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.approve.outputs.pr-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            | jq -r --arg run "$RUN_URL" '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- preview-approval-request -->"))) | select(.body | contains("(" + $run + ")")) | .id' \
            | xargs -r -I{} gh api --method DELETE "repos/$GH_REPO/issues/comments/{}"
