name: Publish PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  NX_NO_CLOUD: ${{ vars.NX_NO_CLOUD }}

concurrency:
  group: publish-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Preview Packages
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'publish-preview')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set preview version
        id: version
        run: |
          VERSION="0.0.0-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Version packages
        run: bunx nx release version ${{ steps.version.outputs.version }} --git-commit false --git-tag false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages
        # Use scripts/publish-packages.ts (not `nx release publish`) so that
        # `workspace:*` and `catalog:` specs are substituted to concrete
        # versions in each manifest before npm packs the tarball — npm
        # publish from inside a package dir does not do this on its own.
        run: bun scripts/publish-packages.ts --tag pr-${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find previous preview comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- pr-preview-packages -->'
          direction: last

      - name: Minimize previous preview comment
        if: steps.find-comment.outputs.comment-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='
            mutation {
              minimizeComment(input: {subjectId: "${{ steps.find-comment.outputs.comment-node-id }}", classifier: OUTDATED}) {
                minimizedComment { isMinimized }
              }
            }'

      - name: Comment on PR
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- pr-preview-packages -->
            **Preview packages published** for commit ${{ github.event.pull_request.head.sha }}

            **Version:** `${{ steps.version.outputs.version }}`
            **Tag:** `pr-${{ github.event.pull_request.number }}`

            ```sh
            bun add @maelstrom-co/protocol@${{ steps.version.outputs.version }}
            bun add @maelstrom-co/engine@${{ steps.version.outputs.version }}
            bun add @maelstrom-co/protocol-old@${{ steps.version.outputs.version }}
            bun add @maelstrom-co/client@${{ steps.version.outputs.version }}
            bun add @maelstrom-co/engine-old@${{ steps.version.outputs.version }}
            bun add @maelstrom-co/voice@${{ steps.version.outputs.version }}
            bun add @maelstrom-co/voice-server@${{ steps.version.outputs.version }}
            ```

            Or install by tag:
            ```sh
            bun add @maelstrom-co/client@pr-${{ github.event.pull_request.number }}
            ```
