name: Publish PR Preview

on:
  # The workflow definition must come from the trusted base branch. Each
  # revision needs an explicit label event before its artifacts are published.
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  TARBALL_DIR: dist/tarballs
  NX_NO_CLOUD: ${{ vars.NX_NO_CLOUD }}

concurrency:
  group: publish-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Build and pack preview packages
    if: >-
      github.repository == 'maelstrom-co/maelstrom'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.label.name == 'publish-preview'
      && github.event.repository.private == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # PR code runs without package-write access or a persisted Actions token.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # One version for every workflow — see .bun-version.
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set preview version
        id: version
        # run_attempt is part of the version because run_number does not change
        # when a run is retried. Registry versions are immutable.
        run: |
          VERSION="0.0.0-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}.${{ github.run_attempt }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Version packages
        # Preview versions never create release tags, so they cannot use tag
        # history as a version baseline.
        run: bunx nx release version "$PREVIEW_VERSION" --first-release --git-commit false --git-tag false
        env:
          PREVIEW_VERSION: ${{ steps.version.outputs.version }}

      - name: Assert registry metadata is complete
        run: bun scripts/assert-registry-metadata.ts

      - name: Build packages
        run: bunx nx run-many -t build --projects='packages/*'

      - name: Pack packages
        run: bun scripts/publish-packages.ts --pack-to "$TARBALL_DIR"

      - name: Upload tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-tarballs
          path: ${{ env.TARBALL_DIR }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Preview Packages
    needs: prepare
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      # Only trusted base-branch publisher code runs beside the write token.
      - name: Checkout publisher code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          filter: tree:0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # One version for every workflow — see .bun-version.
          bun-version-file: .bun-version

      - name: Download tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-tarballs
          path: ${{ env.TARBALL_DIR }}

      # The file contains an environment reference, not the token itself.
      - name: Setup npm for trusted publishing
        run: npm install --global npm@12.2.0 --ignore-scripts

      - name: Configure npm bootstrap auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          : > "$RUNNER_TEMP/.npmrc"
          if [[ -n "$NODE_AUTH_TOKEN" ]]; then
            echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/.npmrc"
          fi
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> "$GITHUB_ENV"

      - name: Publish packages
        run: >-
          bun scripts/publish-tarballs.ts
          --dir "$TARBALL_DIR"
          --expected-version "$VERSION"
          --tag "pr-${PR_NUMBER}"
          --require-existing
          --registry https://registry.npmjs.org
        env:
          VERSION: 0.0.0-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}.${{ github.run_attempt }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # OIDC otherwise attests the base event SHA, not the packed PR head.
          NPM_CONFIG_PROVENANCE: 'false'

      - name: Verify packages are live
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NPM_CONFIG_USERCONFIG: /dev/null
        run: >-
          bun scripts/verify-published.ts
          --version "$VERSION"
          --manifest "$TARBALL_DIR/packed.json"
          --registry https://registry.npmjs.org

      - name: Find previous preview comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- pr-preview-packages -->'
          direction: last

      - name: Minimize previous preview comment
        if: steps.find-comment.outputs.comment-id != ''
        # Cosmetic, and it runs after a successful publish. A GitHub API hiccup
        # must not suppress the install instructions below.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_NODE_ID: ${{ steps.find-comment.outputs.comment-node-id }}
        run: |
          # $id is a GraphQL variable bound by -f, not a shell variable.
          # shellcheck disable=SC2016
          gh api graphql -f query='
            mutation ($id: ID!) {
              minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                minimizedComment { isMinimized }
              }
            }' -f id="$COMMENT_NODE_ID" \
            || echo "::warning::Could not minimize the previous preview comment (non-fatal); continuing."

      - name: Build install command list
        id: packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo 'commands<<PKGEOF'
            node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const manifest = JSON.parse(fs.readFileSync(path.join(process.env.TARBALL_DIR, "packed.json"), "utf8"));
              for (const pkg of manifest.sort((a, b) => a.name.localeCompare(b.name))) {
                console.log(`bun add ${pkg.name}@${process.env.VERSION}`);
              }
            '
            echo 'PKGEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- pr-preview-packages -->
            **Preview packages published** for commit ${{ github.event.pull_request.head.sha }}

            **Version:** `${{ needs.prepare.outputs.version }}`
            **Tag:** `pr-${{ github.event.pull_request.number }}`
            **Registry:** npm

            Install this public npm preview by exact version. No GitHub token or registry setup is required:

            ```sh
            ${{ steps.packages.outputs.commands }}
            ```

            Or install by tag:
            ```sh
            bun add @maelstrom-co/client@pr-${{ github.event.pull_request.number }}
            bun add @maelstrom-co/connectors@pr-${{ github.event.pull_request.number }}
            ```
