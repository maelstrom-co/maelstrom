name: Publish PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  NX_NO_CLOUD: ${{ vars.NX_NO_CLOUD }}

concurrency:
  group: publish-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Preview Packages
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'publish-preview')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set preview version
        id: version
        # run_attempt is part of the version because run_number does not change
        # when a run is retried. Without it, re-running after a partial publish
        # would reuse a version that already exists, and registry versions are
        # immutable — the retry could never succeed.
        run: |
          VERSION="0.0.0-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}.${{ github.run_attempt }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Version packages
        run: bunx nx release version ${{ steps.version.outputs.version }} --git-commit false --git-tag false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Real releases go to public npm; per-PR previews stay on GitHub Packages
      # so throwaway 0.0.0-pr.* versions never reach the public registry (npm
      # publishes are permanent after the 72h unpublish window). The root
      # .npmrc no longer carries registry or auth config — consumers must be
      # able to install with none — so this job supplies its own, in a runner
      # temp file that holds only an env reference, never the token itself.
      - name: Configure GitHub Packages auth
        run: |
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> "$GITHUB_ENV"

      - name: Publish packages
        # Use scripts/publish-packages.ts (not `nx release publish`) so that
        # `workspace:*` and `catalog:` specs are substituted to concrete
        # versions in each manifest before npm packs the tarball — npm
        # publish from inside a package dir does not do this on its own.
        # `nx release publish` additionally breaks against GitHub Packages: its
        # dist-tag pre-check runs `npm view <pkg> versions dist-tags --json`,
        # GitHub Packages answers with an empty `_id`, npm emits nothing, and
        # Nx throws on `JSON.parse('')`.
        # --registry is explicit because the script defaults to public npm, and
        # it overrides each package's publishConfig.registry.
        run: |
          bun scripts/publish-packages.ts \
            --tag pr-${{ github.event.pull_request.number }} \
            --registry https://npm.pkg.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find previous preview comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- pr-preview-packages -->'
          direction: last

      - name: Minimize previous preview comment
        if: steps.find-comment.outputs.comment-id != ''
        # Cosmetic, and it runs after a successful publish. A GitHub API hiccup
        # must not turn a green publish red or suppress the install
        # instructions below, so failures surface as a warning instead.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_NODE_ID: ${{ steps.find-comment.outputs.comment-node-id }}
        run: |
          # $id is a GraphQL variable bound by -f, not a shell variable, so it
          # must stay unexpanded inside the single-quoted query. Binding it
          # keeps step output out of the query string entirely.
          # shellcheck disable=SC2016
          gh api graphql -f query='
            mutation ($id: ID!) {
              minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                minimizedComment { isMinimized }
              }
            }' -f id="$COMMENT_NODE_ID" \
            || echo "::warning::Could not minimize the previous preview comment (non-fatal); continuing."

      # Derived from the workspace rather than hardcoded: the previous fixed
      # list silently went stale every time a package was added or renamed, and
      # a preview comment that names packages which were never published is
      # worse than no list at all.
      - name: Build install command list
        id: packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo 'commands<<PKGEOF'
            node -e '
              const fs = require("node:fs");
              for (const dir of fs.readdirSync("packages").sort()) {
                const path = `packages/${dir}/package.json`;
                if (!fs.existsSync(path)) continue;
                const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
                if (manifest.private === true) continue;
                console.log(`bun add ${manifest.name}@${process.env.VERSION}`);
              }
            '
            echo 'PKGEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- pr-preview-packages -->
            **Preview packages published** for commit ${{ github.event.pull_request.head.sha }}

            **Version:** `${{ steps.version.outputs.version }}`
            **Tag:** `pr-${{ github.event.pull_request.number }}`
            **Registry:** GitHub Packages (previews only — released versions are on public npm)

            Previews are not on npmjs.org, so point the scope at GitHub Packages
            first and authenticate with a PAT that has `read:packages`:

            ```sh
            # .npmrc in the consuming project
            @maelstrom-co:registry=https://npm.pkg.github.com
            //npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}
            ```

            ```sh
            ${{ steps.packages.outputs.commands }}
            ```

            Or install by tag:
            ```sh
            bun add @maelstrom-co/client@pr-${{ github.event.pull_request.number }}
            ```
