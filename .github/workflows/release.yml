name: Release

# Prepare versions and notes in a release PR with `scripts/release.ts`.
# After review and merge, publish a GitHub release targeting the merged commit.
# Only that published release (or an explicit recovery) starts npm publishing.
#
# The workflow is split again internally, for a different reason. `prepare`
# installs dependencies and builds; `publish` holds package write access.
# Neither job does both. A lifecycle script in the dependency tree, or a
# compromised build plugin, runs in a job that has no identity to steal, and
# the job that has one uses `npm publish` as its only package-write operation
# against tarballs that were already packed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v0.1.0. Leave empty to dry-run the current branch.'
        required: false
        type: string
      dry_run:
        description: 'Resolve and pack everything without publishing'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # One run per tag, and never cancel a publish mid-flight: a half-published
  # release has to be finished, not restarted from scratch. Declared at the
  # workflow level so `prepare` and `publish` share one lock rather than
  # racing a second run's prepare against this run's publish.
  group: release-${{ github.event_name == 'release' && github.ref_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  TARBALL_DIR: dist/tarballs
  RELEASE_REGISTRY: https://registry.npmjs.org

jobs:
  prepare:
    name: Build and pack
    if: github.repository == 'maelstrom-co/maelstrom'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No `environment:` here. Approval belongs on the job that publishes; put
    # it here and a reviewer would be waved through before anything is built.
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      # Published releases use the tagged publisher. Manual recovery from main
      # uses that reviewed workflow revision while rebuilding the old tag.
      publisher_commit: ${{ github.event_name == 'workflow_dispatch' && github.sha || steps.commit.outputs.commit }}
      version: ${{ steps.meta.outputs.version }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      # Resolved as an expression rather than a script because it decides what
      # to check out — nothing from the repo is available yet. A release already
      # names the right ref; a dispatch either names a tag or rehearses
      # whatever branch it was launched from.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') && format('refs/tags/{0}', inputs.tag) || github.ref }}
          filter: tree:0
          fetch-depth: 0
          # This job never pushes, and it runs a full install plus build — any
          # lifecycle script in the dependency tree would otherwise be able to
          # read the Actions token out of .git/config.
          persist-credentials: false

      - name: Record prepared commit
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assert tagged dispatch uses main publisher
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != 'refs/heads/main' ]]; then
            echo "::error::A tagged dispatch must be launched from main so package-write code is reviewed."
            exit 1
          fi

      # A tag can be pushed to any commit, including one that never went
      # through review. Checking ancestry here means a release can only ever
      # describe a tree that reached the protected branch — the workflow's own
      # backstop, independent of whether protected-tag rules are configured.
      - name: Assert the release commit is on main
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: main
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${sha}" --jq .status)"
          case "$status" in
            identical|behind)
              echo "Release commit $sha is reachable from $BASE_BRANCH."
              ;;
            *)
              echo "::error::Release commit $sha is not reachable from $BASE_BRANCH (compare status: $status). Refusing to publish an unmerged tree."
              exit 1
              ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # One version for every workflow — see .bun-version.
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release target
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: bun scripts/resolve-release-target.ts

      - name: Keep packages private until the repository launch
        if: steps.meta.outputs.dry_run != 'true'
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "$REPOSITORY_PRIVATE" != 'false' ]]; then
            echo "::error::Public npm publishing is disabled until the repository is public."
            exit 1
          fi

      # Every tag-derived value below reaches the shell through `env:` rather
      # than `${{ }}` interpolation. The values are already constrained to
      # semver by resolve-release-target, but expressions are spliced into the
      # script *before* the shell parses it, so interpolation would make that
      # validation the only thing standing between a tag name and execution.
      - name: Assert manifests match the tag
        # Skipped when rehearsing a branch, which has no tag to agree with.
        if: steps.meta.outputs.version != ''
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: bun scripts/assert-manifest-versions.ts --version "$VERSION"

      # Unconditional: registry metadata is wrong the same way on a rehearsal
      # branch as on a tag, and catching it before the build is the point.
      - name: Assert registry metadata is complete
        run: bun scripts/assert-registry-metadata.ts

      - name: Build packages
        run: bunx nx run-many -t build --projects='packages/*'

      # Pack rather than publish: the tarball is the handoff. `packed.json`
      # travels with it so the publish job knows what it is holding without
      # booting a project graph it has no dependencies for.
      - name: Pack packages
        run: bun scripts/publish-packages.ts --pack-to "$TARBALL_DIR"

      - name: Upload tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarballs
          path: ${{ env.TARBALL_DIR }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: prepare
    # A branch rehearsal has no release version to validate. Its contract ends
    # after the unprivileged job builds and packs; tagged rehearsals continue
    # through this job to validate the privileged artifact handoff.
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # Publishing a GitHub release starts npm publication. Naming an
    # environment gives that an attachment point for required reviewers and
    # wait timers; GitHub creates it on first run, and it carries no protection
    # until one is configured in repository settings.
    environment: production
    steps:
      # Source is checked out for the publish scripts only. Nothing is
      # installed and nothing is built here — that is the entire reason this
      # job is separate from `prepare`.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.publisher_commit }}
          filter: tree:0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        # Only to run the publish scripts. `bun install` is never called in
        # this job. Project dependencies run only in the prepare job.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # One version for every workflow — see .bun-version.
          bun-version-file: .bun-version

      - name: Download tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs
          path: ${{ env.TARBALL_DIR }}

      - name: Setup npm for trusted publishing
        run: npm install --global npm@12.2.0 --ignore-scripts

      - name: Configure npm bootstrap auth
        # Trusted publishing uses OIDC first. This token is only needed until
        # the first npm versions exist and package-level trust is configured.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          : > "$RUNNER_TEMP/.npmrc"
          if [[ -n "$NODE_AUTH_TOKEN" ]]; then
            echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/.npmrc"
          fi
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> "$GITHUB_ENV"

      - name: Publish
        # --skip-published makes a re-run after a partial failure finish the
        # remaining packages instead of dying on the first one that already
        # landed; npm versions are immutable, so re-publishing is a hard error.
        #
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run == 'true' && '--dry-run' || '' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # A manual recovery can build an older tag than the dispatch SHA.
          NPM_CONFIG_PROVENANCE: ${{ github.event_name == 'release' }}
        run: >-
          bun scripts/publish-tarballs.ts
          --dir "$TARBALL_DIR"
          --expected-version "$VERSION"
          --tag "$DIST_TAG"
          --registry "$RELEASE_REGISTRY"
          --skip-published
          $DRY_RUN

      - name: Verify packages are live
        # A green publish step is not proof the registry serves the packages.
        # Confirm every one, so a partial publish fails loudly.
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NPM_CONFIG_USERCONFIG: /dev/null
        run: >-
          bun scripts/verify-published.ts
          --version "$VERSION"
          --manifest "$TARBALL_DIR/packed.json"
          --registry "$RELEASE_REGISTRY"
