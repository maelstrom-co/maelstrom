name: Release

# Publishing is CI's job, not a laptop's. `scripts/release.ts --skip-publish`
# versions, tags, and pushes locally; pushing the tag lands here and this
# workflow does the publish. That split is what makes provenance possible —
# an attestation is only worth something if the build it describes ran
# somewhere auditable.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v0.1.0-alpha.0. Leave empty to dry-run the current branch.'
        required: false
        type: string
      dry_run:
        description: 'Resolve and pack everything without publishing'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write # npm provenance; also the OIDC token for trusted publishing

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A tag push publishes to public npm with no human in the loop. Naming an
    # environment gives that an attachment point for required reviewers and
    # wait timers; GitHub creates it on first run, and it carries no protection
    # until one is configured in repository settings.
    environment: production
    concurrency:
      # One run per tag, and never cancel a publish mid-flight: a half-published
      # release has to be finished, not restarted from scratch.
      group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.ref }}
      cancel-in-progress: false
    steps:
      # Resolved as an expression rather than a script because it decides what
      # to check out — nothing from the repo is available yet. A tag push is
      # already on the right ref; a dispatch either names a tag or rehearses
      # whatever branch it was launched from.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') && format('refs/tags/{0}', inputs.tag) || github.ref }}
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node
        # Deliberately no registry-url. With it, setup-node writes an .npmrc
        # carrying `_authToken=${NODE_AUTH_TOKEN}`; with no token in this
        # tokenless flow that expands to an empty credential, which has been
        # observed to stop npm from falling through to the OIDC exchange.
        # npm's own example does pass registry-url, so this is contested — but
        # the registry is already pinned explicitly by publishConfig and the
        # publish script's --registry, so omitting it costs nothing and is the
        # safe choice under either reading.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches .nvmrc and `engines`. Node 24 also bundles npm 11, clearing
          # the >= 11.5.1 that OIDC trusted publishing needs — on Node 22 this
          # step had to be followed by a global npm upgrade, which meant
          # fetching an unpinned npm into the one job that can publish.
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release target
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: bun scripts/resolve-release-target.ts

      - name: Assert manifests match the tag
        # Skipped when rehearsing a branch, which has no tag to agree with.
        if: steps.meta.outputs.version != ''
        run: bun scripts/assert-manifest-versions.ts --version "${{ steps.meta.outputs.version }}"

      - name: Build packages
        run: bunx nx run-many -t build --projects='packages/*'

      - name: Warn that provenance is unavailable
        if: github.event.repository.visibility != 'public'
        run: echo "::warning::Repository is ${{ github.event.repository.visibility }}; publishing without provenance (npm requires a public repo to attest a build)."

      - name: Publish
        # No token, by design. Auth is npm OIDC trusted publishing: npm trades
        # this job's OIDC identity for a short-lived credential, so nothing
        # long-lived is stored anywhere. It also sidesteps npm's 90-day cap on
        # granular write tokens, which would otherwise mean rotating a secret
        # every quarter and a broken release the one time it's forgotten.
        #
        # --skip-published makes a re-run after a partial failure finish the
        # remaining packages instead of dying on the first one that already
        # landed; npm versions are immutable, so re-publishing is a hard error.
        #
        # Provenance is gated on repository visibility: npm will not attest a
        # build it cannot link to public source. Under OIDC npm also emits
        # provenance on its own for public repos, so the flag is belt and
        # braces — and it turns itself on when this repo goes public.
        run: >-
          bun scripts/publish-packages.ts
          --tag "${{ steps.meta.outputs.dist_tag }}"
          --skip-published
          ${{ github.event.repository.visibility == 'public' && '--provenance' || '' }}
          ${{ steps.meta.outputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Verify packages are live
        # A green publish step is not proof the registry serves the packages.
        # Confirm every one, so a partial publish fails loudly.
        if: steps.meta.outputs.dry_run != 'true'
        run: bun scripts/verify-published.ts --version "${{ steps.meta.outputs.version }}"
