name: Tear Down PR Preview

on:
  pull_request_target:
    types: [synchronize, unlabeled, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to reconcile
        required: true
        type: string
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pull-requests: write

env:
  NX_NO_CLOUD: 'true'

jobs:
  invalidate:
    name: Invalidate Preview Approval
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.action == 'synchronize'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Remove stale preview approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh api --method DELETE
          "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/deploy-preview"

  resolve:
    name: Resolve Teardown Candidates
    if: >-
      (github.event_name != 'workflow_dispatch'
        || github.ref_name == github.event.repository.default_branch)
      && (github.event_name != 'pull_request_target'
      || (
        github.event.pull_request.head.repo.full_name == github.repository
        && (
          github.event.action == 'closed'
          || (github.event.action == 'unlabeled'
            && github.event.label.name == 'deploy-preview')
        )
      ))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    environment: preview
    outputs:
      pr-numbers: ${{ steps.target.outputs.pr-numbers || steps.discover.outputs.pr-numbers }}
    steps:
      - name: Resolve event target
        id: target
        if: github.event_name != 'schedule'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Pull request number must be a positive integer."
            exit 1
          fi
          printf 'pr-numbers=["%s"]\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted discovery code
        if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Setup Bun
        if: github.event_name == 'schedule'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Cloudflare lists deployed scripts but not detached Alchemy state. Exact
      # name parsing ensures arbitrary account resources cannot become targets.
      - name: Discover strict preview candidates
        id: discover
        if: github.event_name == 'schedule'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          candidates="$(bun scripts/delete-preview-workers.ts discover)"
          printf 'pr-numbers=%s\n' "$candidates" >> "$GITHUB_OUTPUT"

  teardown:
    name: Tear Down Preview ${{ matrix.pr-number }}
    needs: resolve
    if: needs.resolve.outputs.pr-numbers != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr-number: ${{ fromJSON(needs.resolve.outputs.pr-numbers) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: preview
    timeout-minutes: 60
    # Every trigger reaches this same lock and current-intent check. Active,
    # labeled previews therefore survive delayed or manually dispatched runs.
    concurrency:
      group: deploy-preview-pr-${{ matrix.pr-number }}
      cancel-in-progress: false
      # actionlint 1.7.12 predates GitHub's May 2026 concurrency queue support.
      queue: max
    steps:
      - name: Check current preview intent
        id: preview-intent
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr-number }}
        run: |
          set -euo pipefail
          intent="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, any(.labels[]; .name == "deploy-preview")] | @tsv')"
          IFS=$'\t' read -r state has_label <<< "$intent"
          if [ "$state" = closed ] || [ "$has_label" = false ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipping stale preview teardown event: state=$state labeled=$has_label"
          fi

      - name: Checkout trusted teardown code
        if: steps.preview-intent.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Setup Node
        if: steps.preview-intent.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        if: steps.preview-intent.outputs.current == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        if: steps.preview-intent.outputs.current == 'true'
        run: bun install --frozen-lockfile

      - name: Destroy docs preview with Alchemy
        id: destroy-docs
        if: steps.preview-intent.outputs.current == 'true'
        timeout-minutes: 10
        working-directory: apps/docs
        env:
          ALCHEMY_PROFILE: preview-ci
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          PREVIEW_STAGE: pr-${{ matrix.pr-number }}
        run: bun alchemy destroy alchemy.preview.run.ts --stage "$PREVIEW_STAGE" --profile preview-ci --yes

      - name: Destroy www preview with Alchemy
        id: destroy-www
        if: always() && steps.preview-intent.outputs.current == 'true'
        timeout-minutes: 10
        working-directory: apps/www
        env:
          ALCHEMY_PROFILE: preview-ci
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          PREVIEW_STAGE: pr-${{ matrix.pr-number }}
        run: bun alchemy destroy alchemy.preview.run.ts --stage "$PREVIEW_STAGE" --profile preview-ci --yes

      - name: Destroy demo preview with Alchemy
        id: destroy-demo
        if: always() && steps.preview-intent.outputs.current == 'true'
        timeout-minutes: 10
        working-directory: apps/demo
        env:
          ALCHEMY_PROFILE: preview-ci
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          PREVIEW_STAGE: pr-${{ matrix.pr-number }}
        run: bun alchemy destroy alchemy.preview.run.ts --stage "$PREVIEW_STAGE" --profile preview-ci --yes

      - name: Delete orphaned preview Workers
        id: delete-workers
        if: always() && steps.preview-intent.outputs.current == 'true'
        timeout-minutes: 12
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          PR_NUMBER: ${{ matrix.pr-number }}
        run: bun scripts/delete-preview-workers.ts

      - name: Find existing preview comment
        if: always() && steps.preview-intent.outputs.current == 'true'
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ matrix.pr-number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- pr-preview-demo -->'
          direction: last

      - name: Mark the preview comment torn down
        if: >-
          always()
          && steps.preview-intent.outputs.current == 'true'
          && steps.find-comment.outputs.comment-id != ''
          && steps.destroy-docs.outcome == 'success'
          && steps.destroy-www.outcome == 'success'
          && steps.destroy-demo.outcome == 'success'
          && steps.delete-workers.outcome == 'success'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ matrix.pr-number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- pr-preview-demo -->
            **PR previews torn down.** The website, documentation, and demo preview Workers for this PR have been deleted.

            Re-add the `deploy-preview` label while the PR is open to bring it back.

      - name: Mark incomplete preview teardown
        if: >-
          always()
          && steps.preview-intent.outputs.current == 'true'
          && steps.find-comment.outputs.comment-id != ''
          && (steps.destroy-docs.outcome != 'success'
            || steps.destroy-www.outcome != 'success'
            || steps.destroy-demo.outcome != 'success'
            || steps.delete-workers.outcome != 'success')
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ matrix.pr-number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- pr-preview-demo -->
            **PR preview teardown incomplete.** At least one Cloudflare cleanup step failed. Retry this workflow before assuming every preview resource is gone.
