[config]
repo_context_files = ["AGENTS.md", "docs/architecture.md"]
repo_context_max_lines = 700
publish_output_progress = false
verbosity_level = 0

[pr_reviewer]
inline_key_issues = true
persistent_comment = true
num_max_findings = 5
enable_review_labels_security = false
enable_review_labels_effort = false
enable_intro_text = false
enable_help_text = false
extra_instructions = """
Keep the review body short: give a verdict and the main themes.
Report actionable findings with severity, the affected file and line,
the concrete failure, and a suggested fix. Focus on correctness,
security, compatibility of published APIs, and architecture boundaries.
Avoid style findings already covered by Biome.
Distinguish verified behavior from assumptions. Tests must protect
meaningful behavior and fail when that behavior changes.
"""

[pr_code_suggestions]
num_code_suggestions_per_chunk = 3
suggestions_score_threshold = 7
extra_instructions = """
Prefer small fixes for concrete defects. Follow AGENTS.md and preserve
published API compatibility. Avoid speculative refactors and style changes.
"""

[ignore]
glob = ["bun.lock", "**/dist/**", "**/node_modules/**", "**/*.snap"]
