StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Maelstrom

Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft

# Keep local review useful without forcing the existing docs to adopt every
# opinionated Microsoft error-level rule at once.
Vale.Spelling = NO
# Accepted vocabulary remains available as style exceptions. Vale.Avoid still
# enforces rejected vocabulary independently at error level.
Vale.Terms = NO
Microsoft.Auto = NO
Microsoft.Avoid = NO
Microsoft.Contractions = NO
Microsoft.Dashes = NO
Microsoft.Foreign = NO
Microsoft.Quotes = NO

# These warning-level rules assume general consumer documentation or conflict
# with Maelstrom's AI terminology and established first-person voice.
Microsoft.Adverbs = NO
Microsoft.FirstPerson = NO
Microsoft.GeneralURL = NO
Microsoft.HeadingAcronyms = NO
Microsoft.Terms = NO
Microsoft.We = NO

# Technical procedures name the input action when it matters, including clicks.
Microsoft.UIVerbs = NO
